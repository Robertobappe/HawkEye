events {
    worker_connections 1024;
}

http {
    upstream product_service {
        server product-service:8000;
    }

    upstream price_watcher {
        server price-watcher:8081;
    }

    upstream notification_service {
        server notification-service:8082;
    }

    server {
        listen 80;
        server_name localhost;

        # Product Service API
        location /api/v1/products {
            proxy_pass http://product_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/alerts {
            proxy_pass http://product_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health checks
        location /health/product-service {
            proxy_pass http://product_service/health;
        }

        location /health/price-watcher {
            proxy_pass http://price_watcher/health;
        }

        location /health/notification-service {
            proxy_pass http://notification_service/health;
        }

        # Gateway health
        location /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
